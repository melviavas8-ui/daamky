name: migrate-to-yarn
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Remove broken Fabric API mixin
        run: |
          rm -f src/main/java/dev/daamky/client/mixin/ModNioResourcePackMixin.java
          sed -i 's/"ModNioResourcePackMixin",//' src/main/resources/daamky.mixins.json

      - name: Migrate sources intermediary -> yarn
        run: |
          chmod +x gradlew
          ./gradlew migrateMappings --mappings "1.21.4+build.8" --no-daemon --stacktrace

      - name: Swap sources and mappings
        run: |
          rm -rf src/main/java
          mv remappedSrc src/main/java
          python3 - <<'PY'
          import re
          s = open('build.gradle').read()
          s = re.sub(r'mappings loom\.layered\(\) \{.*?\n    \}',
                     'mappings "net.fabricmc:yarn:1.21.4+build.8:v2"', s, flags=re.S)
          open('build.gradle', 'w').write(s)
          PY
          grep -n "mappings" build.gradle

      - name: Build
        continue-on-error: true
        run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daamky-yarn
          path: |
            src
            build.gradle
            build/libs
